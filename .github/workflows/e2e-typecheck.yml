name: E2E Typecheck

on:
  push:
    paths:
      - "src/e2e.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/e2e-typecheck.yml"
  pull_request:
    paths:
      - "src/e2e.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/e2e-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout e2e
        uses: actions/checkout@v4

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: vibefi/vibefi
          path: monorepo
          token: ${{ secrets.MONOREPO_READ_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rewrite @vibefi/shared to local monorepo path
        run: |
          node -e 'const fs=require("node:fs"); const p="package.json"; const j=JSON.parse(fs.readFileSync(p,"utf8")); const candidates=["./monorepo/shared","./monorepo/packages/shared"]; const chosen=candidates.find((c)=>fs.existsSync(c)); if(!chosen){ throw new Error("Could not find @vibefi/shared in monorepo checkout"); } j.dependencies["@vibefi/shared"]=`file:${chosen}`; fs.writeFileSync(p, `${JSON.stringify(j,null,2)}\n`); console.log(`Using @vibefi/shared -> file:${chosen}`);'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
