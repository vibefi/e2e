name: E2E Typecheck

on:
  push:
    paths:
      - "src/e2e.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/e2e-typecheck.yml"
  pull_request:
    paths:
      - "src/e2e.ts"
      - "tsconfig.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/e2e-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
